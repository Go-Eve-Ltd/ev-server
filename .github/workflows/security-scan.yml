# Go Eve automated security scanning
#
# Runs on every pull request, every push to the default branch, and weekly (Mondays).
#   - SAST:                Semgrep (OWASP Top 10, JS/TS, Node, secrets rules)
#   - Dependencies, IaC,
#     secrets in files:    Trivy filesystem scan (needs package-lock.json / yarn.lock committed)
#   - Secrets in history:  Gitleaks over the full git history
#   - DAST (optional):     OWASP ZAP baseline, passive and unauthenticated, report-only,
#                          weekly against a staging URL
#
# All reports are kept as workflow artifacts for 90 days (evidence for customer security
# questionnaires). Note: reports may contain matched secret values, so restrict who has
# read access to the repo and rotate anything they find.
#
# Setup (Settings > Secrets and variables > Actions > Variables):
#   ZAP_TARGET_URL = https://your-staging-url   optional, enables the weekly DAST scan. NEVER production.
#   UPLOAD_SARIF   = true                       optional, only if GitHub code scanning is enabled for the repo
#   FAIL_ON_HIGH   = true                       optional, blocks PRs on HIGH/CRITICAL findings once the
#                                               initial backlog has been triaged
#
# Supply chain: every action is pinned to a full commit SHA and every scanner image to a digest.
# Dependabot (github-actions ecosystem) keeps the action SHAs current. The image digests in `env`
# are NOT updated by Dependabot: review and bump them by hand roughly quarterly.

name: Security scan

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ZAP_IMAGE: zaproxy/zap-stable:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep (full report)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src "${SEMGREP_IMAGE}" \
            semgrep scan \
              --config p/owasp-top-ten \
              --config p/javascript \
              --config p/typescript \
              --config p/nodejs \
              --config p/secrets \
              --metrics off \
              --sarif-output=semgrep.sarif \
              --text-output=semgrep.txt

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload to Security tab
        if: always() && vars.UPLOAD_SARIF == 'true' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gate on high-severity findings
        if: vars.FAIL_ON_HIGH == 'true'
        run: |
          python3 - <<'EOF'
          import json, sys
          runs = json.load(open("semgrep.sarif")).get("runs", [])
          errors = [r for run in runs for r in run.get("results", []) if r.get("level") == "error"]
          print(f"Semgrep high-severity findings: {len(errors)}")
          sys.exit(1 if errors else 0)
          EOF

  trivy:
    name: Dependencies, secrets and IaC (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy (SARIF, medium and above)
        run: |
          mkdir -p .trivycache
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src "${TRIVY_IMAGE}" \
            fs --cache-dir /src/.trivycache \
               --scanners vuln,secret,misconfig \
               --severity MEDIUM,HIGH,CRITICAL \
               --skip-dirs "**/node_modules" --skip-dirs .trivycache \
               --format sarif --output trivy.sarif .

      - name: Run Trivy (readable summary, high and critical)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src "${TRIVY_IMAGE}" \
            fs --cache-dir /src/.trivycache --skip-db-update --skip-check-update \
               --scanners vuln,secret,misconfig \
               --severity HIGH,CRITICAL \
               --skip-dirs "**/node_modules" --skip-dirs .trivycache \
               --format table --output trivy-high-critical.txt \
               --exit-code ${{ vars.FAIL_ON_HIGH == 'true' && '1' || '0' }} .

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: |
            trivy.sarif
            trivy-high-critical.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload to Security tab
        if: always() && vars.UPLOAD_SARIF == 'true' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: trivy

  gitleaks:
    name: Secrets in git history (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks over full history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${GITHUB_WORKSPACE}:/src" -w /src "${GITLEAKS_IMAGE}" \
            git /src --redact \
              --report-format json --report-path /src/gitleaks.json \
              --exit-code ${{ vars.FAIL_ON_HIGH == 'true' && '1' || '0' }}

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.json
          retention-days: 90
          if-no-files-found: warn

  zap-baseline:
    name: DAST (OWASP ZAP baseline)
    # Weekly or manual only, and only when a staging target is configured.
    if: vars.ZAP_TARGET_URL != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Run ZAP baseline (passive rules, no active attacks)
        env:
          TARGET: ${{ vars.ZAP_TARGET_URL }}
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "${PWD}/zap:/zap/wrk" "${ZAP_IMAGE}" \
            zap-baseline.py -t "${TARGET}" -j -m 5 \
              -r zap-report.html -J zap-report.json -I

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline-report
          path: zap/
          retention-days: 90
          if-no-files-found: warn
